<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <title>班咭 · 人力資源管理</title>
  </head>
  <body>
    <div id="app">
      <div style="font-family:Arial,'Noto Sans HK',sans-serif;min-height:100vh;background:#f7f8fa;color:#20262e;padding:48px;">
        <div style="max-width:1100px;margin:auto;background:#fff;border:1px solid #e8ebed;border-radius:12px;padding:34px;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:30px"><div style="width:38px;height:38px;border-radius:10px;background:#176e64;color:#fff;display:grid;place-items:center;font-weight:bold">班</div><div><strong style="font-size:22px">班咭</strong><div style="font-size:10px;letter-spacing:2px;color:#89949b">WORKFORCE</div></div></div>
          <div style="color:#98a3aa;font-size:12px">香港門市 · 概覽</div><h1 style="font-size:30px;margin:10px 0 4px">早安，林經理 ✦</h1><p style="color:#909aa1">這是香港門市今天的出勤概況。</p>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:28px">
            <div style="border:1px solid #e8ebed;border-radius:9px;padding:18px"><small>今日出勤率</small><h2>86.7%</h2><span style="color:#3f9b81;font-size:12px">↑ 4.2% 較上週平均</span></div>
            <div style="border:1px solid #e8ebed;border-radius:9px;padding:18px"><small>已打卡</small><h2>26 <small>/ 30 人</small></h2><span style="color:#909aa1;font-size:12px">尚有 4 人未打卡</span></div>
            <div style="border:1px solid #e8ebed;border-radius:9px;padding:18px"><small>遲到人數</small><h2 style="color:#d47f51">3 人</h2><span style="color:#ce7952;font-size:12px">↑ 1 人較昨日</span></div>
            <div style="border:1px solid #e8ebed;border-radius:9px;padding:18px"><small>待處理申請</small><h2>5 項</h2><span style="color:#398b7c;font-size:12px">查看全部 →</span></div>
          </div>
          <div style="margin-top:24px;border:1px solid #e8ebed;border-radius:9px;padding:20px"><h2 style="font-size:16px;margin:0 0 4px">今日出勤</h2><p style="font-size:12px;color:#99a2a8;margin-top:0">即時更新於 09:45</p><p style="font-size:13px;color:#66727a">陳嘉欣　準時　08:57　　梁志強　遲到 12 分鐘　09:42　　黃樂兒　未打卡</p></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
